<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Anonymously</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      resize: vertical;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #111;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .view-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #111;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Ask Anonymously</h1>

    <p class="subtitle">
      Send your question anonymously. Your name and identity will not be displayed.
    </p>

    <form id="questionForm">

      <textarea
        id="question"
        placeholder="Type your question here..."
        required
      ></textarea>

      <button type="submit" id="submitBtn">
        Submit Question
      </button>

    </form>

    <div id="message"></div>

    <a href="questions.html" class="view-link">
      View Submitted Questions →
    </a>

  </div>


  <script>

    // Replace these with your Supabase credentials
    const SUPABASE_URL = "https://cvvkmqyyoaqlzbbvdbxp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2dmttcXl5b2FxbHpiYnZkYnhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzkyNTgsImV4cCI6MjEwMzE1NTI1OH0.rJbBDpBjTFvGMOP4UKdhbmItEySxgsAjE1Nw0wyr8UA";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("questionForm");
    const questionInput = document.getElementById("question");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const question = questionInput.value.trim();

      if (!question) {
        message.textContent = "Please enter a question.";
        message.className = "error";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      const { error } = await supabaseClient
        .from("questions")
        .insert([
          {
            question: question
          }
        ]);

      if (error) {

        console.error(error);

        message.textContent =
          "Something went wrong. Please try again.";

        message.className = "error";

      } else {

        questionInput.value = "";

        message.textContent =
          "Your question has been submitted anonymously.";

        message.className = "success";
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "Submit Question";

    });

  </script>

</body>
</html>
