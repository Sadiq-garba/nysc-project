<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Questions</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
    }

    .questions {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .question {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .question-text {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .time {
      font-size: 13px;
      color: #888;
    }

    .empty {
      text-align: center;
      padding: 50px;
      color: #777;
    }

    .new-question {
      display: block;
      width: fit-content;
      margin: 30px auto;
      padding: 12px 20px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

  </style>

</head>

<body>

  <div class="container">

    <header>

      <h1>Anonymous Questions</h1>

      <p class="subtitle">
        Questions submitted by participants
      </p>

    </header>

    <div id="questions" class="questions">

      <div class="empty">
        Loading questions...
      </div>

    </div>

    <a href="index.html" class="new-question">
      Ask a Question
    </a>

  </div>


  <script>

    // Replace these with your Supabase credentials
     const SUPABASE_URL = "https://cvvkmqyyoaqlzbbvdbxp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2dmttcXl5b2FxbHpiYnZkYnhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzkyNTgsImV4cCI6MjEwMzE1NTI1OH0.rJbBDpBjTFvGMOP4UKdhbmItEySxgsAjE1Nw0wyr8UA";


    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const questionsContainer =
      document.getElementById("questions");


    async function loadQuestions() {

      const { data, error } = await supabaseClient
        .from("questions")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {

        console.error(error);

        questionsContainer.innerHTML = `
          <div class="empty">
            Failed to load questions.
          </div>
        `;

        return;
      }

      displayQuestions(data);
    }


    function displayQuestions(questions) {

      if (!questions || questions.length === 0) {

        questionsContainer.innerHTML = `
          <div class="empty">
            No questions have been submitted yet.
          </div>
        `;

        return;
      }

      questionsContainer.innerHTML = "";

      questions.forEach((item) => {

        const questionElement =
          document.createElement("div");

        questionElement.className = "question";

        const questionText =
          document.createElement("div");

        questionText.className = "question-text";

        // textContent prevents submitted HTML from executing
        questionText.textContent = item.question;

        const time =
          document.createElement("div");

        time.className = "time";

        time.textContent =
          new Date(item.created_at).toLocaleString();

        questionElement.appendChild(questionText);
        questionElement.appendChild(time);

        questionsContainer.appendChild(questionElement);

      });
    }


    // Load existing questions
   setInterval(() => {
  loadQuestions();
}, 2000);


    // Listen for new questions in real time
    supabaseClient
  .channel("questions-live")
  .on(
    "postgres_changes",
    {
      event: "INSERT",
      schema: "public",
      table: "questions"
    },
    (payload) => {

      console.log("New question received:", payload.new);

      // Add the new question directly to the page
      addQuestion(payload.new);

    }
  )
  .subscribe((status) => {
    console.log("Realtime status:", status);
  });


// Add a single new question to the page
function addQuestion(item) {

  // Remove "No questions..." message if it exists
  const emptyMessage =
    questionsContainer.querySelector(".empty");

  if (emptyMessage) {
    emptyMessage.remove();
  }

  const questionElement =
    document.createElement("div");

  questionElement.className = "question";

  const questionText =
    document.createElement("div");

  questionText.className = "question-text";

  questionText.textContent = item.question;

  const time =
    document.createElement("div");

  time.className = "time";

  time.textContent =
    new Date(item.created_at).toLocaleString();

  questionElement.appendChild(questionText);
  questionElement.appendChild(time);

  // Put newest question at the top
  questionsContainer.prepend(questionElement);
}

  </script>

</body>
</html>
