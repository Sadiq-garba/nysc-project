<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Questions</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05070b;
      --card: #0c1119;
      --border: rgba(255,255,255,.09);
      --text: #ffffff;
      --muted: #8b95a7;
      --accent: #00e5ff;
      --accent2: #7c3aed;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 40%, rgba(0,229,255,.08), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(124,58,237,.08), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    /* =========================
       LOADER
    ========================= */

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #030508;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-box {
      text-align: center;
    }

    .loader-ring {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 2px solid rgba(0,229,255,.12);
      border-top-color: var(--accent);
      border-right-color: var(--accent2);
      animation: spin 1s linear infinite;
      margin: auto;
      position: relative;
    }

    .loader-ring::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 2px solid rgba(124,58,237,.15);
      border-bottom-color: var(--accent);
      animation: spinReverse .7s linear infinite;
    }

    .loader-text {
      margin-top: 25px;
      font-size: 13px;
      letter-spacing: 4px;
      color: #9ca3af;
      text-transform: uppercase;
    }

    .loader-dots {
      margin-top: 12px;
      font-size: 12px;
      color: var(--accent);
      animation: blink 1.2s infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinReverse {
      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }
    }

    /* =========================
       MAIN
    ========================= */

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* subtle grid */

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .18;

      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

      background-size: 40px 40px;
    }

    header {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 35px 20px 15px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .4;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 700;
      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 8px;
      font-size: 14px;
    }

    /* =========================
       VIEWER
    ========================= */

    .viewer {
      position: relative;
      z-index: 2;
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .question-wrapper {
      width: min(850px, 100%);
      position: relative;
    }

    .question-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.015)
        );

      border: 1px solid var(--border);
      border-radius: 24px;

      min-height: 350px;

      padding: clamp(30px, 6vw, 65px);

      display: flex;
      flex-direction: column;
      justify-content: center;

      position: relative;

      box-shadow:
        0 30px 100px rgba(0,0,0,.5),
        inset 0 0 40px rgba(0,229,255,.02);

      overflow: hidden;
    }

    /* glowing corner */

    .question-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      top: -100px;
      right: -100px;

      background: var(--accent);
      filter: blur(90px);
      opacity: .12;
    }

    .question-card::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      bottom: -100px;
      left: -80px;

      background: var(--accent2);
      filter: blur(90px);
      opacity: .12;
    }

    .question-number {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .question-text {
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.35;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }

    .question-time {
      color: var(--muted);
      font-size: 12px;
      margin-top: 35px;
      position: relative;
      z-index: 1;
    }

    /* =========================
       SLIDE ANIMATIONS
    ========================= */

    .slide-next {
      animation: slideNext .45s ease;
    }

    .slide-prev {
      animation: slidePrev .45s ease;
    }

    @keyframes slideNext {
      0% {
        opacity: 0;
        transform: translateX(70px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slidePrev {
      0% {
        opacity: 0;
        transform: translateX(-70px);
      }

      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      position: relative;
      z-index: 3;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 15px;

      padding: 20px;
    }

    .nav-btn {
      width: 52px;
      height: 52px;

      border-radius: 50%;

      border: 1px solid var(--border);

      background: rgba(255,255,255,.04);

      color: white;

      cursor: pointer;

      font-size: 20px;

      transition: .25s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(0,229,255,.1);
      border-color: rgba(0,229,255,.5);
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0,229,255,.15);
    }

    .nav-btn:disabled {
      opacity: .25;
      cursor: not-allowed;
    }

    .counter {
      min-width: 100px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 50px 20px;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 20px;
      opacity: .6;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      position: relative;
      z-index: 2;

      text-align: center;

      padding: 10px 20px 25px;

      color: #566070;

      font-size: 11px;

      letter-spacing: 1px;
    }

    .new-question {
      display: inline-block;

      margin-top: 12px;

      padding: 10px 18px;

      border-radius: 8px;

      border: 1px solid var(--border);

      color: #aaa;

      text-decoration: none;

      font-size: 12px;

      transition: .2s;
    }

    .new-question:hover {
      color: white;
      border-color: var(--accent);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding-top: 25px;
      }

      .question-card {
        min-height: 380px;
        border-radius: 18px;
        padding: 30px;
      }

      .question-text {
        font-size: 25px;
      }

      .controls {
        padding-bottom: 10px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       TECH PRELOADER
  ========================= -->

  <div id="loader">

    <div class="loader-box">

      <div class="loader-ring"></div>

      <div class="loader-text">
        Loading Questions
      </div>

      <div class="loader-dots">
        CONNECTING TO LIVE FEED...
      </div>

    </div>

  </div>


  <!-- =========================
       APP
  ========================= -->

  <div class="app">

    <header>

      <div class="live-indicator">
        <span class="live-dot"></span>
        Live Questions
      </div>

      <h1>Anonymous Questions</h1>

      <p class="subtitle">
        Questions submitted by participants
      </p>

    </header>


    <main class="viewer">

      <div class="question-wrapper">

        <div id="questionCard" class="question-card">

          <div class="empty">

            <div class="empty-icon">
              ?
            </div>

            <div>
              Waiting for questions...
            </div>

          </div>

        </div>

      </div>

    </main>


    <div class="controls">

      <button
        id="prevBtn"
        class="nav-btn"
        aria-label="Previous question"
      >
        ←
      </button>

      <div
        id="counter"
        class="counter"
      >
        0 / 0
      </div>

      <button
        id="nextBtn"
        class="nav-btn"
        aria-label="Next question"
      >
        →
      </button>

    </div>


    <footer>

      <div>
        Use ← and → to navigate
      </div>

      <a
        href="index.html"
        class="new-question"
      >
        Ask a Question
      </a>

    </footer>

  </div>


  <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://cvvkmqyyoaqlzbbvdbxp.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2dmttcXl5b2FxbHpiYnZkYnhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzkyNTgsImV4cCI6MjEwMzE1NTI1OH0.rJbBDpBjTFvGMOP4UKdhbmItEySxgsAjE1Nw0wyr8UA";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================
       VARIABLES
    ===================================== */

    const questionCard =
      document.getElementById("questionCard");

    const counter =
      document.getElementById("counter");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const loader =
      document.getElementById("loader");


    let questions = [];

    let currentIndex = 0;


    /* =====================================
       LOAD QUESTIONS
    ===================================== */

    async function loadQuestions() {

      const {
        data,
        error
      } = await supabaseClient
        .from("questions")
        .select("*")
        .order("created_at", {
          ascending: false
        });


      if (error) {

        console.error(error);

        questionCard.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              ⚠
            </div>

            Failed to load questions.

          </div>
        `;

        return;

      }


      questions = data || [];


      if (questions.length > 0) {

        /*
          Keep the current question visible
          when refreshing the data.
        */

        if (currentIndex >= questions.length) {

          currentIndex = questions.length - 1;

        }

        renderQuestion(false);

      } else {

        showEmpty();

      }

    }


    /* =====================================
       SHOW QUESTION
    ===================================== */

    function renderQuestion(direction = "next") {

      if (!questions.length) {

        showEmpty();

        return;

      }


      const item =
        questions[currentIndex];


      questionCard.classList.remove(
        "slide-next",
        "slide-prev"
      );


      /*
        Force browser reflow so the animation
        can restart every time.
      */

      void questionCard.offsetWidth;


      questionCard.classList.add(
        direction === "prev"
          ? "slide-prev"
          : "slide-next"
      );


      questionCard.innerHTML = `

        <div class="question-number">

          QUESTION
          ${String(currentIndex + 1).padStart(2, "0")}

        </div>


        <div class="question-text"></div>


        <div class="question-time"></div>

      `;


      /*
        textContent is intentionally used
        instead of innerHTML.
      */

      const textElement =
        questionCard.querySelector(
          ".question-text"
        );


      textElement.textContent =
        item.question;


      const timeElement =
        questionCard.querySelector(
          ".question-time"
        );


      timeElement.textContent =
        new Date(
          item.created_at
        ).toLocaleString();


      updateControls();

    }


    /* =====================================
       EMPTY STATE
    ===================================== */

    function showEmpty() {

      questionCard.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ?
          </div>

          <div>
            No questions have been submitted yet.
          </div>

        </div>

      `;


      counter.textContent =
        "0 / 0";


      prevBtn.disabled = true;

      nextBtn.disabled = true;

    }


    /* =====================================
       CONTROLS
    ===================================== */

    function updateControls() {

      counter.textContent =
        `${currentIndex + 1} / ${questions.length}`;


      prevBtn.disabled =
        currentIndex === 0;


      nextBtn.disabled =
        currentIndex === questions.length - 1;

    }


    function nextQuestion() {

      if (
        currentIndex <
        questions.length - 1
      ) {

        currentIndex++;

        renderQuestion("next");

      }

    }


    function previousQuestion() {

      if (currentIndex > 0) {

        currentIndex--;

        renderQuestion("prev");

      }

    }


    prevBtn.addEventListener(
      "click",
      previousQuestion
    );


    nextBtn.addEventListener(
      "click",
      nextQuestion
    );


    /* =====================================
       KEYBOARD NAVIGATION
    ===================================== */

    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "ArrowRight") {

          nextQuestion();

        }

        if (event.key === "ArrowLeft") {

          previousQuestion();

        }

      }
    );


    /* =====================================
       REALTIME NEW QUESTIONS
    ===================================== */

    supabaseClient

      .channel("questions-live")

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "questions"
        },

        (payload) => {

          console.log(
            "New question:",
            payload.new
          );


          /*
            Add the new question at the beginning
            because newest questions come first.
          */

          questions.unshift(
            payload.new
          );


          /*
            If this is the first question,
            show it immediately.
          */

          if (questions.length === 1) {

            currentIndex = 0;

            renderQuestion("next");

            return;

          }


          /*
            Keep the viewer on the question
            the user is currently reading.

            Because we inserted a question at
            index 0, move the index forward.
          */

          currentIndex++;


          updateControls();

        }

      )

      .subscribe((status) => {

        console.log(
          "Realtime status:",
          status
        );

      });


    /* =====================================
       FALLBACK REFRESH
    ===================================== */

    /*
      This keeps the page synchronized even if
      realtime disconnects temporarily.
    */

    setInterval(
      loadQuestions,
      5000
    );


    /* =====================================
       INITIAL LOAD
    ===================================== */

    async function init() {

      await loadQuestions();


      /*
        Give the tech loader a little time
        to finish its animation.
      */

      setTimeout(() => {

        loader.classList.add("hide");

      }, 700);

    }


    init();

  </script>

</body>
</html>
